<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Domkowo – galeria postaci</title>
<style>body{margin:0;background:#dfe9f2;font-family:sans-serif}#info{position:fixed;top:8px;left:8px;background:#fff9;padding:6px 10px;border-radius:8px;font-size:13px}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script></head><body><div id="info">Galeria wygenerowanych postaci – odśwież z ?seed=liczba</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as PM from './postac.js';
import * as WG from './wyglad.js';
const q = new URLSearchParams(location.search), base = +(q.get('seed') || 1), N = +(q.get('n') || 12);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(Math.min(2, devicePixelRatio)); r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color('#dfe9f2');
sc.add(new THREE.HemisphereLight('#fff', '#8a7a66', 1.3)); const sun = new THREE.DirectionalLight('#fff4e0', 1.8); sun.position.set(3, 6, 8); sc.add(sun);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100); const per = Math.min(6, N), dz = +(q.get('d') || (1.6 + per * 1.05)); cam.position.set(0, +(q.get('y') || 1.3), dz);
const ctl = new OrbitControls(cam, r.domElement); ctl.target.set(0, +(q.get('ty') || 1), 0);
const clips = await PM.loadAnimations().catch(() => null);
const chars = [], info = [];
for (let i = 0; i < N; i++) {
  const L = WG.generateLook(base * 1000 + i);
  const ch = await PM.buildCharacter(L);
  const g = new THREE.Group(); g.add(ch.root); g.position.set((i % per - (per - 1) / 2) * 1.0, 0, -Math.floor(i / per) * 1.6); if (q.get('rot')) g.rotation.y = +q.get('rot'); sc.add(g);
  chars.push(ch); info.push(`${L.name} ${L.surname || ''}: ${WG.describeLook(L)}`);
}
window.__looks = info;
const clk = new THREE.Clock();
r.setAnimationLoop(() => { const dt = clk.getDelta(), t = clk.elapsedTime; chars.forEach(c => PM.animateCharacter(c, { pose: 'stand' }, dt, t, clips)); ctl.update(); r.render(sc, cam); });
</script></body></html>
