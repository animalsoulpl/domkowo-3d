<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Domkowo – symulator życia</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; background: #e9eef5; color: #233; }
  button { font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 6px 10px; background: #fff; box-shadow: 0 1px 2px #0002; }
  button:hover { background: #f3f7ff; }
  button.on { background: #4a7cf0; color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  /* Kreator */
  #creator { max-width: 760px; margin: 30px auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px #0001; display: flex; gap: 24px; }
  #creator .opts { flex: 1; }
  #creator label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  #creator input[type=text] { width: 100%; padding: 8px; font-size: 16px; border: 1px solid #ccd; border-radius: 8px; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .sw { box-shadow: inset 0 0 0 1px #0002; width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
  .sw.sel { border-color: #233; }
  .chip { padding: 5px 10px; border-radius: 14px; background: #eef; cursor: pointer; font-size: 14px; }
  .chip.sel { background: #4a7cf0; color: #fff; }
  #preview { background: linear-gradient(#cfe3ff, #f6faff); border-radius: 12px; }
  #startBtn { margin-top: 18px; width: 100%; padding: 12px; font-size: 18px; background: #3bb273; color: #fff; }
  /* Gra */
  #game { display: none; max-width: 1150px; margin: 10px auto; padding: 0 10px; }
  #top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #fff; padding: 8px 12px; border-radius: 12px; box-shadow: 0 1px 4px #0001; }
  #top .grow { flex: 1; }
  .stat { font-weight: 600; }
  #main { display: flex; gap: 10px; margin-top: 10px; align-items: flex-start; flex-wrap: wrap; }
  #wrap { position: relative; flex: 1 1 520px; max-width: 768px; }
  canvas#c { display: block; border-radius: 12px; box-shadow: 0 2px 10px #0002; width: 100%; max-width: 768px; height: auto; }
  #side { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 10px; }
  .panel { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 4px #0001; }
  .panel h3 { margin: 0 0 8px; font-size: 15px; }
  .need { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 6px; margin: 4px 0; font-size: 13px; }
  .bar { height: 12px; background: #e3e7ee; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 6px; transition: width .2s; }
  #queue { display: flex; gap: 6px; min-height: 40px; flex-wrap: wrap; }
  .qi { width: 40px; height: 40px; border-radius: 10px; background: #eef3ff; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; position: relative; }
  .qi.cur { background: #ffe9a8; }
  .qi:hover::after { content: "✕"; position: absolute; top: -4px; right: -4px; background: #e44; color: #fff; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  #log { font-size: 12.5px; max-height: 130px; overflow-y: auto; line-height: 1.45; }
  #log div:first-child { font-weight: 600; }
  #menu { position: absolute; display: none; flex-direction: column; gap: 4px; background: #fff; padding: 6px; border-radius: 10px; box-shadow: 0 4px 14px #0003; z-index: 5; min-width: 170px; }
  #menu .title { font-size: 12px; color: #678; padding: 2px 6px; }
  #menu button { text-align: left; box-shadow: none; background: #f2f5fb; }
  #menu button:hover { background: #dfe8ff; }
  #shop { display: none; }
  #shop .items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #shop .it { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 8px; background: #f2f5fb; cursor: pointer; font-size: 12.5px; border: 2px solid transparent; }
  #shop .it.sel { border-color: #4a7cf0; }
  #shop .it .e { font-size: 22px; }
  #shop .it small { display: block; color: #678; }
  .hint { font-size: 12px; color: #678; margin-top: 6px; }
</style>
</head>
<body>

<!-- ============ KREATOR POSTACI ============ -->
<div id="creator">
  <div class="opts">
    <h1>🏡 Domkowo</h1>
    <div style="color:#567">Stwórz swojego ludzika i zadbaj o jego życie!</div>
    <label>Imię</label>
    <input type="text" id="cName" value="Ola" maxlength="14">
    <label>Kolor skóry</label><div class="swatches" id="cSkin"></div>
    <label>Fryzura</label><div class="swatches" id="cHairStyle"></div>
    <label>Kolor włosów</label><div class="swatches" id="cHair"></div>
    <label>Koszulka</label><div class="swatches" id="cShirt"></div>
    <label>Spodnie / spódnica</label><div class="swatches" id="cPants"></div>
    <label>Charakter (wpływa na potrzeby)</label><div class="swatches" id="cTrait"></div>
    <button id="startBtn">Zamieszkaj! ▶</button>
  </div>
  <canvas id="preview" width="220" height="320"></canvas>
</div>

<!-- ============ GRA ============ -->
<div id="game">
  <div id="top">
    <span class="stat" id="tName"></span>
    <span class="stat" id="tMood"></span>
    <span class="stat" id="tMoney"></span>
    <span class="stat" id="tTime"></span>
    <span class="grow"></span>
    <button data-sp="0" class="spd">⏸</button>
    <button data-sp="1" class="spd on">▶</button>
    <button data-sp="2" class="spd">▶▶</button>
    <button data-sp="3" class="spd">▶▶▶</button>
    <button id="workBtn">💼 Do pracy</button>
    <button id="buildBtn">🔨 Kup / Buduj</button>
    <button id="freeBtn" class="on" title="Ludzik sam dba o siebie, gdy nic nie robi">🧠 Wolna wola</button>
    <button id="newBtn" title="Zacznij od nowa">🔄</button>
  </div>
  <div id="main">
    <div id="wrap">
      <canvas id="c" width="768" height="528"></canvas>
      <div id="menu"></div>
    </div>
    <div id="side">
      <div class="panel" id="needsPanel"><h3>Potrzeby</h3><div id="needs"></div></div>
      <div class="panel"><h3>Kolejka czynności <span style="font-weight:400;font-size:12px;color:#789">(kliknij, by anulować)</span></h3><div id="queue"></div></div>
      <div class="panel" id="shop">
        <h3>Sklep meblowy</h3>
        <div class="items" id="shopItems"></div>
        <div class="hint">Wybierz mebel i kliknij na podłodze, żeby go postawić. Narzędzie 💰 Sprzedaj: kliknij mebel, żeby go sprzedać za połowę ceny.</div>
      </div>
      <div class="panel"><h3>Praca: <span id="jobName"></span></h3><div id="jobInfo" style="font-size:13px"></div></div>
      <div class="panel"><h3>Dziennik</h3><div id="log"></div></div>
    </div>
  </div>
</div>

<script>
// ===================== USTAWIENIA =====================
const T = 48, COLS = 16, ROWS = 11;
const SKINS = ['#ffe0c7', '#f5c7a1', '#d9a273', '#a86b43', '#6e4428', '#4a2e1c'];
const HAIRS = ['#2b1d14', '#5a3a22', '#a8642e', '#e8c26a', '#d6452b', '#888888', '#7b4bd6', '#2f9bd6'];
const CLOTHES = ['#e8505b', '#f9a03f', '#f6d743', '#3bb273', '#2f9bd6', '#7b4bd6', '#ec6fb4', '#ffffff', '#333a44'];
const HAIR_STYLES = [['short', 'Krótkie'], ['long', 'Długie'], ['bun', 'Kok'], ['pony', 'Kucyki'], ['curly', 'Loki'], ['bald', 'Brak']];
const TRAITS = [
  ['none', 'Zwyczajny', {}],
  ['glutton', 'Łasuch 🍰', { hunger: 1.3 }],
  ['social', 'Towarzyski 💬', { social: 1.5 }],
  ['lazy', 'Śpioch 😴', { energy: 1.3 }],
  ['playful', 'Wesołek 🎉', { fun: 1.4 }],
  ['clean', 'Czyścioszek 🧼', { hygiene: 1.4 }],
];
const NEEDS = [
  ['hunger', 'Głód', '🍔'], ['energy', 'Energia', '⚡'], ['bladder', 'Pęcherz', '🚽'],
  ['hygiene', 'Higiena', '🧼'], ['fun', 'Zabawa', '🎮'], ['social', 'Towarzystwo', '💬'],
];
// spadek potrzeb na minutę gry
const DECAY = { hunger: 0.085, energy: 0.1, bladder: 0.14, hygiene: 0.06, fun: 0.08, social: 0.05 };
const WARN = { hunger: 'Burczy mi w brzuchu!', energy: 'Padam z nóg…', bladder: 'Muszę do łazienki!', hygiene: 'Przydałby się prysznic…', fun: 'Nudzę się!', social: 'Brakuje mi ludzi…' };

// ===================== MEBLE =====================
// rate = ile punktów potrzeby na minutę gry, max = maks. minut, inside = ludzik jest "w" meblu
const DEFS = {
  bed:     { name: 'Łóżko', e: '🛏️', w: 2, h: 2, price: 300, col: '#9db8ff', actions: [
             { label: 'Śpij', need: 'energy', rate: 0.32, icon: '💤', inside: true, lie: true },
             { label: 'Zdrzemnij się', need: 'energy', rate: 0.3, max: 60, icon: '😴', inside: true, lie: true }] },
  shower:  { name: 'Prysznic', e: '🚿', w: 1, h: 1, price: 200, col: '#bfe6ff', actions: [
             { label: 'Weź prysznic', need: 'hygiene', rate: 5, icon: '🚿', inside: true, max: 25 }] },
  bath:    { name: 'Wanna', e: '🛁', w: 2, h: 1, price: 450, col: '#d6f0ff', actions: [
             { label: 'Weź kąpiel', need: 'hygiene', rate: 3.5, icon: '🛁', inside: true, max: 40, fx: { fun: 0.6 } }] },
  toilet:  { name: 'Toaleta', e: '🚽', w: 1, h: 1, price: 150, col: '#f2f2f2', actions: [
             { label: 'Skorzystaj', need: 'bladder', rate: 10, icon: '🚽', inside: true, max: 12 }] },
  fridge:  { name: 'Lodówka', e: '🧊', w: 1, h: 1, price: 250, col: '#e6eef5', actions: [
             { label: 'Zjedz przekąskę (za darmo)', need: 'hunger', rate: 2, max: 15, icon: '🥪' },
             { label: 'Zrób kanapki (10 zł)', need: 'hunger', rate: 2.4, max: 30, icon: '🥗', cost: 10 }] },
  stove:   { name: 'Kuchenka', e: '🍳', w: 1, h: 1, price: 300, col: '#d0d4da', actions: [
             { label: 'Ugotuj obiad (18 zł)', need: 'hunger', rate: 3, max: 45, icon: '🍝', cost: 18, fx: { fun: 0.3 } },
             { label: 'Upiecz ciasto (25 zł)', need: 'fun', rate: 1.2, max: 60, icon: '🎂', cost: 25, fx: { hunger: 0.8 } }] },
  tv:      { name: 'Telewizor', e: '📺', w: 2, h: 1, price: 350, col: '#444b55', actions: [
             { label: 'Oglądaj TV', need: 'fun', rate: 1.6, max: 60, icon: '📺' },
             { label: 'Oglądaj gotowanie', need: 'fun', rate: 1.2, max: 45, icon: '👩‍🍳' }] },
  sofa:    { name: 'Kanapa', e: '🛋️', w: 2, h: 1, price: 280, col: '#e8a3a3', actions: [
             { label: 'Odpocznij', need: 'energy', rate: 0.6, max: 40, icon: '🛋️', inside: true, fx: { fun: 0.4 } }] },
  phone:   { name: 'Telefon', e: '☎️', w: 1, h: 1, price: 80, col: '#ffe3b3', actions: [
             { label: 'Zadzwoń do przyjaciela', need: 'social', rate: 1.8, max: 40, icon: '📞' },
             { label: 'Zamów pizzę (30 zł)', need: 'hunger', rate: 4, max: 20, icon: '🍕', cost: 30 }] },
  computer:{ name: 'Komputer', e: '💻', w: 1, h: 1, price: 500, col: '#cfd6e6', actions: [
             { label: 'Graj w gry', need: 'fun', rate: 2.2, max: 60, icon: '🎮' },
             { label: 'Czatuj ze znajomymi', need: 'social', rate: 1.6, max: 45, icon: '💬' },
             { label: 'Dorabiaj online (+zł)', icon: '💸', max: 120, money: 0.35, fx: { fun: -0.15 } }] },
  books:   { name: 'Regał z książkami', e: '📚', w: 1, h: 1, price: 220, col: '#c49a6c', beauty: 2, actions: [
             { label: 'Czytaj książkę', need: 'fun', rate: 1.3, max: 60, icon: '📖' }] },
  guitar:  { name: 'Gitara', e: '🎸', w: 1, h: 1, price: 320, col: '#f3d9b1', beauty: 1, actions: [
             { label: 'Graj na gitarze', need: 'fun', rate: 2, max: 50, icon: '🎵', fx: { social: 0.3 } }] },
  aquarium:{ name: 'Akwarium', e: '🐠', w: 1, h: 1, price: 260, col: '#9fdcf2', beauty: 5, actions: [
             { label: 'Patrz na rybki', need: 'fun', rate: 1, max: 30, icon: '🐟' }] },
  plant:   { name: 'Roślinka', e: '🪴', w: 1, h: 1, price: 60, col: null, beauty: 3, actions: [
             { label: 'Podlej kwiatek', need: 'fun', rate: 0.6, max: 10, icon: '💧' }] },
  lamp:    { name: 'Lampa', e: '💡', w: 1, h: 1, price: 90, col: null, beauty: 2, light: true, actions: [] },
  picture: { name: 'Obraz', e: '🖼️', w: 1, h: 1, price: 140, col: null, beauty: 4, actions: [
             { label: 'Podziwiaj obraz', need: 'fun', rate: 0.8, max: 15, icon: '🎨' }] },
  rug:     { name: 'Dywan', e: '', w: 2, h: 2, price: 150, col: '#e9c46a', beauty: 4, floor: true, actions: [] },
};
const SHOP_ORDER = ['bed', 'sofa', 'tv', 'computer', 'fridge', 'stove', 'shower', 'bath', 'toilet', 'phone', 'books', 'guitar', 'aquarium', 'plant', 'lamp', 'picture', 'rug'];

const JOBS = [
  ['Praktykant', 90], ['Młodszy specjalista', 140], ['Specjalista', 200], ['Kierownik zespołu', 290], ['Dyrektor', 420], ['Prezes 👑', 650],
];
const DAYS = ['Nd', 'Pon', 'Wt', 'Śr', 'Czw', 'Pt', 'Sob'];
const DOOR = { x: 7, y: 10 };

// ===================== MAPA =====================
// 1 = ściana, 2 = łazienka, 3 = sypialnia, 4 = salon/kuchnia, 5 = drzwi
const map = [];
for (let y = 0; y < ROWS; y++) {
  map[y] = [];
  for (let x = 0; x < COLS; x++) {
    let t;
    if (y === 0 || y === ROWS - 1 || x === 0 || x === COLS - 1) t = 1;
    else if (y === 5) t = 1;
    else if (y < 5 && x === 5) t = 1;
    else if (y < 5 && x < 5) t = 2;
    else if (y < 5) t = 3;
    else t = 4;
    map[y][x] = t;
  }
}
map[5][3] = 2; map[5][10] = 4; map[DOOR.y][DOOR.x] = 5; // przejścia

// ===================== STAN GRY =====================
let S = null;           // stan zapisywany
let speed = 1, buildMode = false, buildSel = null, freeWill = true;
let hoverTile = null, lastAuto = 0, warnCd = {};
const look = { name: 'Ola', skin: SKINS[1], hairStyle: 'long', hair: HAIRS[2], shirt: CLOTHES[0], pants: CLOTHES[4], trait: 'none' };

function newState() {
  return {
    look: { ...look }, money: 600, t: 8 * 60, // minuty od startu (dzień 1, 8:00)
    needs: { hunger: 70, energy: 80, bladder: 70, hygiene: 75, fun: 60, social: 60 },
    sim: { x: 7, y: 8, path: [], queue: [], cur: null, atWork: false, workUntil: 0, lastWorkDay: 0 },
    job: { lvl: 0, perf: 0 },
    objs: [
      { id: 1, type: 'bed', x: 12, y: 1 }, { id: 2, type: 'shower', x: 1, y: 1 }, { id: 3, type: 'toilet', x: 4, y: 1 },
      { id: 4, type: 'fridge', x: 1, y: 6 }, { id: 5, type: 'tv', x: 10, y: 6 }, { id: 6, type: 'sofa', x: 10, y: 9 },
      { id: 7, type: 'phone', x: 14, y: 6 }, { id: 8, type: 'plant', x: 6, y: 1 },
    ],
    nextId: 100, log: [],
  };
}

// ===================== POMOCNICZE =====================
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
function objAt(x, y, includeFloor = false) {
  for (let i = S.objs.length - 1; i >= 0; i--) {
    const o = S.objs[i], d = DEFS[o.type];
    if (!includeFloor && d.floor) continue;
    if (x >= o.x && x < o.x + d.w && y >= o.y && y < o.y + d.h) return o;
  }
  return null;
}
function walkable(x, y) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return false;
  if (map[y][x] === 1) return false;
  return !objAt(x, y);
}
function bfs(sx, sy, targets) {
  const key = (x, y) => y * COLS + x;
  const tset = new Set(targets.map(t => key(t.x, t.y)));
  const prev = new Map([[key(sx, sy), null]]);
  const q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    if (tset.has(key(x, y))) {
      const path = []; let k = key(x, y);
      while (k !== null) { path.unshift({ x: k % COLS, y: Math.floor(k / COLS) }); k = prev.get(k); }
      path.shift(); return path;
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy, nk = key(nx, ny);
      if (!prev.has(nk) && walkable(nx, ny)) { prev.set(nk, key(x, y)); q.push([nx, ny]); }
    }
  }
  return null;
}
function adjTiles(o) {
  const d = DEFS[o.type], res = [];
  for (let x = o.x; x < o.x + d.w; x++) { res.push({ x, y: o.y - 1 }, { x, y: o.y + d.h }); }
  for (let y = o.y; y < o.y + d.h; y++) { res.push({ x: o.x - 1, y }, { x: o.x + d.w, y }); }
  return res.filter(t => walkable(t.x, t.y) && map[t.y][t.x] !== 5);
}
function simTile() { return { x: Math.round(S.sim.x), y: Math.round(S.sim.y) }; }
function beauty() { return Math.min(20, S.objs.reduce((s, o) => s + (DEFS[o.type].beauty || 0), 0)); }
function mood() {
  const n = S.needs, vals = Object.values(n);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const low = Math.min(...vals);
  return clamp(avg * 0.75 + low * 0.25 + beauty() * 0.6);
}
function moodLabel(m) {
  return m > 78 ? ['😄', 'Świetny'] : m > 58 ? ['🙂', 'Dobry'] : m > 38 ? ['😐', 'Taki sobie'] : m > 18 ? ['😟', 'Kiepski'] : ['😫', 'Fatalny'];
}
function traitMul(need) { const tr = TRAITS.find(t => t[0] === S.look.trait); return (tr && tr[2][need]) || 1; }
function say(text, secs = 3) { S.sim.say = { text, until: performance.now() + secs * 1000 }; }
function log(msg) {
  S.log.unshift(`${clockStr()} ${msg}`); S.log = S.log.slice(0, 40);
  $('log').innerHTML = S.log.map(l => `<div>${l}</div>`).join('');
}
function dayNum() { return Math.floor(S.t / 1440) + 1; }
function hourF() { return (S.t % 1440) / 60; }
function weekday() { return DAYS[dayNum() % 7]; }
function isWeekend() { const d = dayNum() % 7; return d === 0 || d === 6; }
function clockStr() { const m = Math.floor(S.t % 1440); return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; }

// ===================== RYSOWANIE LUDZIKA =====================
function drawSim(ctx, cx, cy, L, sc = 1, opt = {}) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
  if (opt.lie) ctx.rotate(-Math.PI / 2);
  const step = opt.walk ? Math.sin(opt.walk) * 3 : 0;
  // cień
  if (!opt.lie) { ctx.fillStyle = '#0002'; ctx.beginPath(); ctx.ellipse(0, 18, 11, 4, 0, 0, Math.PI * 2); ctx.fill(); }
  // nogi
  ctx.fillStyle = L.pants;
  ctx.fillRect(-7, 6 + Math.max(0, step), 6, 11 - Math.max(0, step));
  ctx.fillRect(1, 6 + Math.max(0, -step), 6, 11 - Math.max(0, -step));
  ctx.fillStyle = '#333'; ctx.fillRect(-8, 16, 7, 3); ctx.fillRect(1, 16, 7, 3);
  // tułów
  ctx.fillStyle = L.shirt; roundRect(ctx, -9, -8, 18, 16, 5); ctx.fill();
  ctx.fillStyle = L.skin; ctx.fillRect(-12, -5 + step / 2, 3, 10); ctx.fillRect(9, -5 - step / 2, 3, 10);
  // włosy z tyłu
  ctx.fillStyle = L.hair;
  if (L.hairStyle === 'long') { roundRect(ctx, -11, -24, 22, 22, 6); ctx.fill(); }
  if (L.hairStyle === 'pony') { ctx.beginPath(); ctx.arc(-12, -16, 5, 0, 7); ctx.arc(12, -16, 5, 0, 7); ctx.fill(); }
  // głowa
  ctx.fillStyle = L.skin; ctx.beginPath(); ctx.arc(0, -17, 10, 0, Math.PI * 2); ctx.fill();
  // włosy z przodu
  ctx.fillStyle = L.hair;
  if (L.hairStyle !== 'bald') {
    ctx.beginPath(); ctx.arc(0, -19, 10.5, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(0, -21); ctx.fill();
  }
  if (L.hairStyle === 'bun') { ctx.beginPath(); ctx.arc(0, -30, 6, 0, 7); ctx.fill(); }
  if (L.hairStyle === 'curly') { for (let a = 0; a < 7; a++) { ctx.beginPath(); ctx.arc(Math.cos(Math.PI + a * 0.52) * 10, -19 + Math.sin(Math.PI + a * 0.52) * 10, 4.5, 0, 7); ctx.fill(); } }
  // twarz
  ctx.fillStyle = '#222';

function enqueue(target, action, auto = false) {
  if (S.sim.queue.length >= 6) { say('Mam już za dużo do zrobienia!'); return; }
  S.sim.queue.push({ target, action, auto });
}
function cancelQueue(i) {
  if (i === -1) { endAction(true); }
  else S.sim.queue.splice(i, 1);
}
function endAction(cancel) {
  const sim = S.sim;
  if (sim.cur && !cancel && sim.cur.action.label) {}
  sim.cur = null; sim.path = []; sim.walking = null;
}

function startNext() {
  const sim = S.sim;
  if (sim.cur || sim.walking || !sim.queue.length) return;
  const q = sim.queue.shift(), st = simTile();
  let targets;
  if (q.target.work) targets = [DOOR];
  else if (q.target.goto) targets = [q.target.goto];
  else {
    const o = S.objs.find(x => x.id === q.target.obj);
    if (!o) return;
    targets = adjTiles(o);
    if (targets.some(t => t.x === st.x && t.y === st.y)) targets = [st];
  }
  const path = bfs(st.x, st.y, targets);
  if (!path) { say('Nie mogę tam dojść! 🤔'); return; }
  sim.path = path; sim.walking = q;
}

function arrive(q) {
  const sim = S.sim; sim.walking = null;
  if (q.target.goto) return;
  if (q.target.work) { goToWork(); return; }
  const o = S.objs.find(x => x.id === q.target.obj);
  if (!o) return;
  const a = q.action;
  if (a.cost) {
    if (S.money < a.cost) { say('Nie stać mnie na to… 💸'); return; }
    S.money -= a.cost;
  }
  if (a.need && S.needs[a.need] >= 98 && !a.money) { say('Nie potrzebuję tego teraz.'); return; }
  sim.cur = { objId: o.id, action: a, elapsed: 0 };
}

function goToWork() {
  const sim = S.sim;

  const m = mood();
  sim.atWork = true; sim.workUntil = S.t + 8 * 60; sim.lastWorkDay = dayNum(); sim.workMood = m;
  sim.queue = []; sim.cur = null;

}
function backFromWork() {
  const sim = S.sim; sim.atWork = false; sim.x = DOOR.x; sim.y = DOOR.y - 1;
  const [title, pay] = JOBS[S.job.lvl];
  const m = sim.workMood;

  if (m < 30) { earn = Math.round(pay * 0.6); S.job.perf = Math.max(0, S.job.perf - 1); log(`😓 Kiepski dzień w pracy (zły nastrój). Zarobek: ${earn} zł`); }
  else { S.job.perf += m > 60 ? 2 : 1; log(`💵 Powrót z pracy: +${earn} zł`); }
  S.money += earn;
  if (S.job.perf >= 6 && S.job.lvl < JOBS.length - 1) {
    S.job.lvl++; S.job.perf = 0; S.money += 150;
    log(`🎉 AWANS! Nowe stanowisko: ${JOBS[S.job.lvl][0]} (+150 zł premii)`); say('Dostałam/em awans! 🎉', 5);
  } else say(m < 30 ? 'Ciężki dzień…' : 'Wróciłam/em z pracy!');

// autonomia – ludzik sam o siebie dba
function autonomy(now) {
  if (!freeWill || S.sim.cur || S.sim.walking || S.sim.queue.length || S.sim.atWork) return;
  if (now - lastAuto < 1500) return;
  lastAuto = now;
  const order = Object.entries(S.needs).sort((a, b) => a[1] - b[1]);
  for (const [need, val] of order) {
    if (val > 45) break;
    let best = null;
    for (const o of S.objs) for (const a of DEFS[o.type].actions) {
      if (a.need !== need || (a.cost && a.cost > S.money)) continue;
      if (need === 'energy' && a.max && val < 25) continue; // zmęczony = prawdziwy sen
      const score = a.rate - (a.cost || 0) * 0.02;
      if (!best || score > best.score) best = { o, a, score };
    }
    if (best) { enqueue({ obj: best.o.id }, best.a, true); return; }
  }
}

// ===================== AKTUALIZACJA =====================
const MIN_PER_SEC = [0, 2, 6, 20];
const MOVE_SPEED = [0, 3, 5, 8];
let lastFrame = performance.now(), lastSave = 0, uiTimer = 0, walkPhase = 0;

function update(dt, now) {
  const gm = dt * MIN_PER_SEC[speed];
  const sim = S.sim;
  if (gm > 0) {
    const prevDay = dayNum();
    S.t += gm;
    // potrzeby
    for (const k in DECAY) {
      let d = DECAY[k] * traitMul(k) * gm;
      if (sim.atWork && (k === 'social')) d *= -2; // w pracy są ludzie
      if (sim.cur && sim.cur.action.lie && k === 'hunger') d *= 0.5;
      if (sim.cur && sim.cur.action.lie && k === 'bladder') d *= 0.5;
      S.needs[k] = clamp(S.needs[k] - d);
    }
    // nowy dzień
    if (dayNum() !== prevDay) {
      log(`📅 Dzień ${dayNum()} (${weekday()})`);
      if (dayNum() % 7 === 1) {
        const val = S.objs.reduce((s, o) => s + DEFS[o.type].price, 0);
        const bill = 60 + Math.round(val * 0.02);
        S.money -= bill; log(`🧾 Rachunki za tydzień: −${bill} zł`);
      }
    }
    // praca
    if (sim.atWork && S.t >= sim.workUntil) backFromWork();
    // bieżąca czynność
    if (sim.cur) {
      const a = sim.cur.action;
      sim.cur.elapsed += gm;
      if (a.need) S.needs[a.need] = clamp(S.needs[a.need] + (a.rate + DECAY[a.need]) * gm);
      if (a.fx) for (const k in a.fx) S.needs[k] = clamp(S.needs[k] + a.fx[k] * gm);
      if (a.money) S.money += a.money * gm;
      const full = a.need && S.needs[a.need] >= 99.5;
      if (full || (a.max && sim.cur.elapsed >= a.max)) {
        if (a.money) log(`💸 Dorobiono online: +${Math.round(a.money * sim.cur.elapsed)} zł`);
        if (a.passOut) log(`😵 ${S.look.name} budzi się na podłodze…`);
        sim.cur = null;
      }
    }
    // kryzysy
    if (!sim.atWork) {
      if (S.needs.bladder <= 0) {
        S.needs.bladder = 100; S.needs.hygiene = 0; S.needs.fun = clamp(S.needs.fun - 30);
        log(`😳 Ups! ${S.look.name} nie zdążyło do toalety…`); say('Ojej… 😳', 4);
        sim.queue = []; sim.cur = null; sim.path = []; sim.walking = null;
      }
      if (S.needs.energy <= 0 && !(sim.cur && sim.cur.action.need === 'energy')) {
        sim.queue = []; sim.path = []; sim.walking = null;
        sim.cur = { objId: null, action: { label: 'Zasnął na podłodze', need: 'energy', rate: 0.15, max: 240, icon: '😵', lie: true, passOut: true, here: true }, elapsed: 0 };
        log(`😵 ${S.look.name} zasypia ze zmęczenia na podłodze!`);
      }
      for (const k in WARN) {
        if (S.needs[k] < 15 && (!warnCd[k] || now - warnCd[k] > 20000)) { warnCd[k] = now; say(WARN[k]); }
      }
    }
  }
  // ruch (w czasie rzeczywistym, przyspieszany)
  if (!sim.atWork && sim.path.length && speed > 0) {
    const nxt = sim.path[0];
    if (!walkable(nxt.x, nxt.y) && map[nxt.y][nxt.x] !== 5) {
      const q = sim.walking; sim.path = []; sim.walking = null; if (q) sim.queue.unshift(q); // przeliczy drogę
    } else {
      const dx = nxt.x - sim.x, dy = nxt.y - sim.y, dist = Math.hypot(dx, dy), step = MOVE_SPEED[speed] * dt;
      walkPhase += dt * 14 * Math.max(1, speed);
      if (dist <= step) { sim.x = nxt.x; sim.y = nxt.y; sim.path.shift(); if (!sim.path.length && sim.walking) arrive(sim.walking); }
      else { sim.x += dx / dist * step; sim.y += dy / dist * step; }
    }
  } else if (!sim.atWork && sim.walking && !sim.path.length) {
    arrive(sim.walking); // stoi już na miejscu
  }
  if (speed > 0) { startNext(); autonomy(now); }
}

const FLOOR = { 2: ['#dff1f7', '#cfe8f1'], 3: ['#e7c9a0', '#dcbb8f'], 4: ['#f3e3c7', '#ead6b4'], 5: ['#9c6b3c', '#9c6b3c'] };

      let bx = clamp(px - w / 2, 4, cv.width - w - 4), by = py - 82;
      if (by < 4) by = py + 30;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#233'; ctx.lineWidth = 1.5; roundRect(ctx, bx, by, w, 26, 10); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#233'; ctx.fillText(sim.say.text, bx + w / 2, by + 13);
    }
  }
  // noc
  const h = hourF();
  let dark = 0;
  if (h < 5) dark = 0.45; else if (h < 7) dark = 0.45 * (7 - h) / 2;
  else if (h > 22) dark = 0.45; else if (h > 19) dark = 0.45 * (h - 19) / 3;
  if (dark > 0) {
    ctx.fillStyle = `rgba(20,30,80,${dark})`; ctx.fillRect(0, 0, cv.width, cv.height);
    // światło lamp
    ctx.globalCompositeOperation = 'lighter';
    for (const o of S.objs) if (DEFS[o.type].light) {
      const g = ctx.createRadialGradient(o.x * T + T / 2, o.y * T + T / 2, 5, o.x * T + T / 2, o.y * T + T / 2, 130);
      g.addColorStop(0, `rgba(255,220,140,${dark * 0.7})`); g.addColorStop(1, 'rgba(255,220,140,0)');
      ctx.fillStyle = g; ctx.fillRect(o.x * T - 130, o.y * T - 130, 300, 300);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  if (sim.atWork) {
    ctx.fillStyle = '#000a'; roundRect(ctx, cv.width / 2 - 170, 12, 340, 34, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
    const left = Math.max(0, sim.workUntil - S.t);
    ctx.fillText(`💼 ${S.look.name} jest w pracy – wróci za ${Math.floor(left / 60)} h ${Math.floor(left % 60)} min`, cv.width / 2, 29);
  }
  if (speed === 0) { ctx.fillStyle = '#0006'; ctx.font = 'bold 26px sans-serif'; ctx.fillText('⏸ PAUZA', cv.width / 2, cv.height / 2); }
}
function drawObj(o, a) {
  const d = DEFS[o.type], x = o.x * T, y = o.y * T, w = d.w * T, h = d.h * T;
  if (d.floor) { ctx.fillStyle = d.col; roundRect(ctx, x + 4, y + 4, w - 8, h - 8, 10); ctx.fill();
    ctx.strokeStyle = '#c0392b88'; ctx.lineWidth = 3; roundRect(ctx, x + 10, y + 10, w - 20, h - 20, 8); ctx.stroke(); return; }
  if (o.type === 'bed') {
    ctx.fillStyle = '#8b5e3c'; roundRect(ctx, x + 4, y + 2, w - 8, h - 4, 6); ctx.fill();
    ctx.fillStyle = '#fff'; roundRect(ctx, x + 8, y + 6, w - 16, h - 12, 5); ctx.fill();
    ctx.fillStyle = '#f4f4f4'; roundRect(ctx, x + 14, y + 10, w - 28, 18, 6); ctx.fill();
    ctx.fillStyle = '#9db8ff'; roundRect(ctx, x + 8, y + 36, w - 16, h - 42, 5); ctx.fill();
    return;
  }
  if (d.col) { ctx.fillStyle = d.col; roundRect(ctx, x + 4, y + 4, w - 8, h - 8, 8); ctx.fill(); ctx.fillStyle = '#0001'; roundRect(ctx, x + 4, y + h - 12, w - 8, 8, 4); ctx.fill(); }
  ctx.font = (Math.min(d.w, d.h) > 1 ? 40 : 30) + 'px serif'; ctx.fillStyle = '#000';
  ctx.fillText(d.e, x + w / 2, y + h / 2 + 2);
}

// ===================== PANEL BOCZNY =====================
function renderUI() {
  const m = mood(), ml = moodLabel(m);
  $('tName').textContent = '👤 ' + S.look.name;
  $('tMood').textContent = `${ml[0]} ${ml[1]}`;
  $('tMoney').textContent = `💰 ${Math.floor(S.money)} zł`; $('tMoney').style.color = S.money < 0 ? '#d33' : '';
  $('tTime').textContent = `📅 Dzień ${dayNum()} (${weekday()}) 🕐 ${clockStr()}`;
  $('needs').innerHTML = NEEDS.map(([k, n, e]) => {
    const v = S.needs[k], c = v > 60 ? '#3bb273' : v > 30 ? '#f2b134' : '#e5534b';
    return `<div class="need"><span>${e} ${n}</span><div class="bar"><i style="width:${v}%;background:${c}"></i></div></div>`;
  }).join('') + `<div class="need"><span>✨ Wystrój</span><div class="bar"><i style="width:${beauty() * 5}%;background:#a77bf0"></i></div></div>`;
  const q = $('queue'); const sim = S.sim;
  const items = [];
  if (sim.cur) items.push({ i: -1, icon: sim.cur.action.icon, cur: true, label: sim.cur.action.label });
  if (sim.walking) items.push({ i: -2, icon: sim.walking.action.icon, cur: true, label: sim.walking.action.label });
  sim.queue.forEach((x, i) => items.push({ i, icon: x.action.icon, label: x.action.label }));
  q.innerHTML = items.length ? '' : '<span style="color:#89a;font-size:13px">Nic do zrobienia. Kliknij mebel!</span>';
  items.forEach(it => {
    const d = document.createElement('div'); d.className = 'qi' + (it.cur ? ' cur' : ''); d.textContent = it.icon; d.title = it.label;
    d.onclick = () => { if (it.i === -2) { sim.path = []; sim.walking = null; } else cancelQueue(it.i); renderUI(); };
    q.appendChild(d);
  });
  const [title, pay] = JOBS[S.job.lvl];
  $('jobName').textContent = title;
  const worked = sim.lastWorkDay === dayNum();
  $('jobInfo').innerHTML = `Pensja: <b>${pay} zł</b> za dzień · Postęp do awansu: ${'⭐'.repeat(Math.min(6, S.job.perf))}${'☆'.repeat(Math.max(0, 6 - S.job.perf))}<br>
    <span style="color:#678">Praca w dni robocze, wyjście między 6:00 a 11:00, trwa 8 h. Dobry nastrój = szybszy awans.</span>
    ${sim.atWork ? '<br><b>Teraz w pracy 💼</b>' : worked ? '<br>Dziś już po pracy ✅' : isWeekend() ? '<br>Weekend – wolne! 🎉' : ''}`;
  $('workBtn').disabled = sim.atWork;
}

// ===================== PĘTLA =====================
function loop(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  if (S && $('game').style.display === 'block') {
    update(dt, now); drawWorld(now);
    uiTimer += dt; if (uiTimer > 0.2) { uiTimer = 0; renderUI(); }
    if (now - lastSave > 5000) { lastSave = now; save(); }
  }
  requestAnimationFrame(loop);
}
if (load()) { Object.assign(look, S.look); startGame(); log(`👋 Witaj z powrotem!`); }
requestAnimationFrame(loop);
</script>
