<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Podgląd postaci</title>
<style>body{margin:0;overflow:hidden;font-family:sans-serif}#info{position:fixed;top:8px;left:8px;background:#fffc;padding:6px 10px;border-radius:8px;font-size:12px;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="info">ładowanie…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildCharacter, poseCharacter, animateCharacter, loadAnimations } from './postac.js';
const CLIPS = await loadAnimations();
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(devicePixelRatio); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#cfe3f5');
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);
const q = new URLSearchParams(location.search);
cam.position.set(0, +(q.get('cy') || 1.0), +(q.get('cz') || 7));
const ctl = new OrbitControls(cam, r.domElement); ctl.target.set(0, +(q.get('ty') || 0.9), 0);
scene.add(new THREE.HemisphereLight('#fff', '#887', 1.3)); const d = new THREE.DirectionalLight('#fff', 2.2); d.position.set(2, 4, 3); scene.add(d);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: '#c9b08a' })); fl.rotation.x = -Math.PI / 2; scene.add(fl);
const info = document.getElementById('info');
const variants = [
  [{ body: 'f', outfit: 'Peasant', hairModel: 'Hair_Long', hair: '#7a4a2a' }, { pose: 'stand' }],
  [{ body: 'f', outfit: 'RangerNoHood', hairModel: 'Hair_Buns', hair: '#2b1d14', skin: '#c58c64' }, { pose: 'walk' }],
  [{ body: 'm', outfit: 'Peasant', hairModel: 'Hair_SimpleParted', hair: '#3b2a1e', beard: true }, { pose: 'stand', anim: 'arms' }],
  [{ body: 'm', outfit: 'Ranger', hairModel: 'none' }, { pose: 'stand', anim: 'phone' }],
];
const chars = [];
try {
  for (let i = 0; i < variants.length; i++) {
    const ch = await buildCharacter(variants[i][0]);
    ch.root.position.x = (i - 1.5) * 0.9; scene.add(ch.root); chars.push([ch, variants[i][1]]);
  }
  info.textContent = chars.map(([c]) => `skala ${c.scale.toFixed(3)} miednica ${c.pelvisY.toFixed(2)}`).join('\n');
} catch (e) { info.textContent = 'BŁĄD: ' + e.message + '\n' + e.stack; }
let t = 0;
window.render = (tt, dt = 0.016) => { chars.forEach(([c, st]) => { animateCharacter(c, st, dt, tt ?? t, CLIPS); }); ctl.update(); r.render(scene, cam); };
(function loop() { t += 0.016; window.render(); requestAnimationFrame(loop); })();
</script></body></html>
